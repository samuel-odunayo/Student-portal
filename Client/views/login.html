<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login - Student Admission Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="../public/images/logo.svg" type="image/x-icon">
  <link href="../public/css/styles.css" rel="stylesheet">
  <style>
    .login-container {
      max-width: 460px;
      margin: 80px auto 40px auto;
    }
    .card-login {
      border: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border-radius: 12px;
    }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
      <a class="navbar-brand" href="./index.html">
        <img src="../public/images/logo.svg" alt="Logo" width="40" class="d-inline-block align-text-top">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" title="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="./index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./form.html">Register</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="./login.html">Login</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Form Container -->
  <main class="container">
    <div class="login-container">
      <div class="card card-login p-4">
        <div class="text-center mb-4">
          <img src="../public/images/logo.svg" alt="Logo" width="55" class="mb-2"><br>
          <h4 class="fw-bold">Sign In</h4>
          <p class="text-muted small">Sign in to access your account</p>
        </div>

        <!-- Alert messages -->
        <div id="loginAlert" class="alert d-none" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required autofocus>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="loginPassword" class="form-label fw-semibold mb-0">Password</label>
              <a href="#" class="small text-decoration-none" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot Password?</a>
            </div>
            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold">
            Sign In
          </button>
        </form>

        <div class="text-center mt-3">
          <span class="text-muted small">Need to apply?</span>
          <a href="./form.html" class="small fw-semibold text-decoration-none">Register here</a>
        </div>
      </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="forgotModalLabel">Reset Your Password</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="forgotPasswordForm">
            <div class="modal-body">
              <p class="text-muted small mb-3">
                Enter your registered email address and we will issue a new temporary password to your account.
              </p>
              <div id="forgotAlert" class="alert d-none" role="alert"></div>
              <div class="mb-3">
                <label for="forgotEmail" class="form-label fw-semibold">Registered Email Address</label>
                <input type="email" class="form-control" id="forgotEmail" placeholder="e.g. name@portal.edu" required>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" id="forgotSubmitBtn" class="btn btn-primary">Send Temporary Password</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white mt-auto">
    <div class="container py-3">
      <div class="text-center">
        &copy; 2025 Student Portal. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../public/js/login.js"></script>
</body>
</html>
