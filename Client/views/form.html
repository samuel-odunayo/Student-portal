<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student-portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="../public/images/logo.svg" type="image/x-icon">
  <link href="../public/css/styles.css" rel="stylesheet">
  <link href="../public/css/form.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
          <a class="navbar-brand" href="./index.html">
            <img src="../public/images/logo.svg" alt="Logo" width="40" class="d-inline-block align-text-top">
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" title="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
              <li class="nav-item">
                <a class="nav-link" href="./index.html">Home</a>
              </li>
              <li class="nav-item d-none" id="navDashboard">
                <a class="nav-link" href="#" id="dashboardLink">Dashboard</a>
              </li>
              <li class="nav-item" id="navRegister">
                <a class="nav-link active" href="./form.html">Register</a>
              </li>
              <li class="nav-item" id="navLogin">
                <a class="nav-link" href="./login.html">Login</a>
              </li>
              <li class="nav-item d-none ms-2" id="navLogout">
                <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
              </li>
            </ul>
          </div>
        </div>
      </nav>

  <main class="container mt-5 pt-5">
    <div class="main-container">
      <h2 class="text-center mb-4">Please fill in all required information</h2>

      <form id="registrationForm" enctype="multipart/form-data">
        <div class="form-section">
          <h4 class="form-section-header">Personal Information</h4>
          
          <div class="mb-3">
            <label class="form-label">Upload Image (Optional):</label>
            <input type="file" class="form-control" name="image" accept="image/*" title="Upload your image">
          </div>

          <div class="row">
            <div class="col-md-6">
              <input type="text" class="form-control" name="firstName" placeholder="Enter FirstName" required>
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" name="middleName" placeholder="Enter MiddleName">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <input type="text" class="form-control" name="lastName" placeholder="Enter LastName" required>
            </div>
            <div class="col-md-6">
              <input type="email" class="form-control" name="email" placeholder="Enter Email Address" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <label for="dob" class="form-label">Date of Birth:</label>
              <input type="date" class="form-control" name="dob" id="dob" title="Enter your date of birth" required>
            </div>
            <div class="col-md-6">
              <div class="d-flex gap-4 mt-2">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="gender" value="male" id="male" required>
                  <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="gender" value="female" id="female" required>
                  <label class="form-check-label" for="female">Female</label>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <input type="tel" class="form-control" name="phone" placeholder="Enter PhoneNumber" required>
            </div>
            <div class="col-md-6">
              <textarea class="form-control" name="address" placeholder="Enter Address" required></textarea>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <label for="state" class="form-label">State:</label>
              <select id="state" class="form-select" name="state" required>
                <option value="">Select State</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="localGovernment" class="form-label">Local Government:</label>
              <select id="localGovernment" class="form-select" name="localGovernment" required>
                <option value="">Select Local Government</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-12">
              <input type="text" class="form-control" name="nextOfKin" placeholder="Enter The Name OF NextOfKin" required>
            </div>
          </div>
        </div>

        <div class="form-section mt-4">
          <h4 class="form-section-header">Academics Related Information</h4>
        
          <div class="row">
            <div class="col-md-6">
              <input type="number" class="form-control" name="jambScore" placeholder="Enter JAMB Score" required>
            </div>
          </div>
        </div>
        

        <div class="text-center">
          <button type="submit" class="submit-button">Submit</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="bg-dark text-white mt-auto">
    <div class="container py-3">
      <div class="text-center">
        &copy; 2025 Student Portal. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../public/js/form.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('portal_token');
      if (token) {
        const role = localStorage.getItem('portal_role');
        const studentId = localStorage.getItem('portal_student_id');
        const dashboardUrl = role === 'admin' ? './student.html' : (studentId ? `./details.html?id=${studentId}` : './details.html');

        const navLogin = document.getElementById('navLogin');
        const navDashboard = document.getElementById('navDashboard');
        const dashboardLink = document.getElementById('dashboardLink');
        const navLogout = document.getElementById('navLogout');
        const logoutBtn = document.getElementById('logoutBtn');

        // Disable/hide Login button; keep Dashboard and Logout
        if (navLogin) navLogin.classList.add('d-none');
        if (navDashboard) {
          navDashboard.classList.remove('d-none');
          if (dashboardLink) dashboardLink.href = dashboardUrl;
        }
        if (navLogout) navLogout.classList.remove('d-none');

        if (logoutBtn) {
          logoutBtn.addEventListener('click', () => {
            localStorage.clear();
            window.location.reload();
          });
        }
      }
    });
  </script>
</body>
</html>
